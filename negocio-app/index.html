<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg?v=4" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png?v=4" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png?v=4" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <script>
      // En el celular, «sitio de escritorio» a veces no ensancha la página.
      // Si sigue con el ancho del teléfono, se usa el de una computadora.
      // En pantallas grandes (p. ej. S25 Ultra) el modo escritorio puede inflar
      // screen.* y ya no parecer «teléfono»; igual hay que forzar el viewport.
      ;(function () {
        var agente = navigator.userAgent || ''
        var datos = navigator.userAgentData
        var tactil = navigator.maxTouchPoints > 0
        if (!tactil) return
        if ((window.innerWidth || 0) >= 980) return
        var androidEscritorio =
          (/Android/i.test(agente) && !/Mobile/i.test(agente)) ||
          (!!datos && datos.mobile === false && /android/i.test(datos.platform || ''))
        var iphoneEscritorio = /Macintosh/i.test(agente)
        var otroEscritorio = !/Mobile|iPhone|iPad|Android/i.test(agente)
        var datosEscritorio = !!datos && datos.mobile === false
        if (!androidEscritorio && !iphoneEscritorio && !otroEscritorio && !datosEscritorio) return
        var meta = document.querySelector('meta[name="viewport"]')
        if (meta) meta.setAttribute('content', 'width=1280')
      })()
    </script>
    <meta name="theme-color" content="#F5F0E8" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="Negocio" />
    <meta name="mobile-web-app-capable" content="yes" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Anton&family=Inter:wght@400;500;600&display=swap"
      rel="stylesheet"
      media="print"
      onload="this.media='all'"
    />
    <noscript>
      <link
        href="https://fonts.googleapis.com/css2?family=Anton&family=Inter:wght@400;500;600&display=swap"
        rel="stylesheet"
      />
    </noscript>
    <title>Negocio</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
